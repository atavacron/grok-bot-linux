name: linux-port

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Grok Bot version to port (empty = probe)"
        required: false
        type: string
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/linux-port.yml"
      - "VERSION"

permissions:
  contents: write

jobs:
  detect-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl unzip build-essential python3 \
            squashfs-tools desktop-file-utils

      - name: Detect version
        id: detect
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: bash scripts/detect-version.sh

      - name: Skip if nothing new (scheduled)
        if: github.event_name == 'schedule' && steps.detect.outputs.is_new != 'true'
        run: echo "No newer installer than $(cat VERSION)"

      - name: Build Linux artifacts
        if: github.event_name != 'schedule' || steps.detect.outputs.is_new == 'true'
        run: bash scripts/port.sh "${{ steps.detect.outputs.version }}"

      - name: Upload artifacts
        if: github.event_name != 'schedule' || steps.detect.outputs.is_new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grok-bot-linux-${{ steps.detect.outputs.version }}
          path: dist/*

      - name: Release
        if: github.event_name != 'schedule' || steps.detect.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --cached --quiet || git commit -m "package Grok Bot ${VER} for Linux"
          git push || true
          gh release create "v${VER}" dist/* \
            --title "Grok Bot ${VER} (Linux)" \
            --notes "Unofficial wine-less Linux port of Grok Bot ${VER}." \
            --clobber || gh release upload "v${VER}" dist/* --clobber
